<title>সামনের নম্বর প্লেট মেকার</title>
<script>
  // Apply saved theme and language before first paint to avoid a flash
  try {
    const th = localStorage.getItem("fp-theme"); if (th) document.documentElement.setAttribute("data-theme", th);
    document.documentElement.lang = localStorage.getItem("fp-lang") || "bn";
  } catch (e) { document.documentElement.lang = "bn"; }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@700;800&family=Baloo+Da+2:wght@700;800&family=Anek+Bangla:wght@800&family=Noto+Serif+Bengali:wght@800&family=Tiro+Bangla&family=Mina:wght@700&family=Atma:wght@700&family=Galada&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    darkMode: ["selector", '[data-theme="dark"]'],
    theme: {
      extend: {
        colors: {
          bg: "rgb(var(--bg) / <alpha-value>)",
          surface: "rgb(var(--surface) / <alpha-value>)",
          bench: "rgb(var(--bench) / <alpha-value>)",
          ink: "rgb(var(--ink) / <alpha-value>)",
          muted: "rgb(var(--muted) / <alpha-value>)",
          line: "rgb(var(--line) / <alpha-value>)",
          accent: "rgb(var(--accent) / <alpha-value>)",
          "accent-ink": "rgb(var(--accent-ink) / <alpha-value>)",
          ok: "rgb(var(--ok) / <alpha-value>)",
          warn: "rgb(var(--warn) / <alpha-value>)",
          bad: "rgb(var(--bad) / <alpha-value>)"
        },
        fontFamily: {
          ui: ['"Hind Siliguri"', '"Noto Sans Bengali"', "system-ui", "sans-serif"],
          mono: ['"IBM Plex Mono"', "ui-monospace", "monospace"]
        },
        screens: { xs: "400px", "3xl": "1800px" }
      }
    }
  };
</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.14.1/cdn.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
/* Layout: sign-shop workbench. Mobile: centered title, plate pinned on top, form below, action bar fixed at the bottom.
   Tablet/desktop: form left, sticky plate + checks + downloads right. Tokens are RGB triplets for Tailwind alpha. */
:root{
  --bg:238 240 238; --surface:255 255 255; --bench:217 221 217; --ink:20 24 21; --muted:91 98 93; --line:201 206 201;
  --accent:226 164 0; --accent-ink:29 22 0; --ok:31 122 69; --warn:180 86 11; --bad:179 38 30;
  /* deadline alert: warning (amber) and danger (red) */
  --al-warn-bg:255 246 225; --al-warn-bd:236 196 112; --al-warn-fg:110 66 0; --al-warn-hi:176 102 0;
  --al-bad-bg:253 236 234; --al-bad-bd:240 170 162; --al-bad-fg:128 24 16; --al-bad-hi:190 36 26;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:18 21 19; --surface:27 31 28; --bench:37 42 38; --ink:233 236 233; --muted:154 162 156; --line:52 58 53;
  --accent:240 181 28; --accent-ink:29 22 0; --ok:76 194 126; --warn:240 149 74; --bad:255 123 114;
  --al-warn-bg:50 38 12; --al-warn-bd:116 86 24; --al-warn-fg:250 214 140; --al-warn-hi:255 190 70;
  --al-bad-bg:56 20 18; --al-bad-bd:128 44 38; --al-bad-fg:255 190 182; --al-bad-hi:255 120 108;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:18 21 19; --surface:27 31 28; --bench:37 42 38; --ink:233 236 233; --muted:154 162 156; --line:52 58 53;
  --accent:240 181 28; --accent-ink:29 22 0; --ok:76 194 126; --warn:240 149 74; --bad:255 123 114;
  --al-warn-bg:50 38 12; --al-warn-bd:116 86 24; --al-warn-fg:250 214 140; --al-warn-hi:255 190 70;
  --al-bad-bg:56 20 18; --al-bad-bd:128 44 38; --al-bad-fg:255 190 182; --al-bad-hi:255 120 108;
  color-scheme:dark}
html{-webkit-text-size-adjust:100%}
body{background:rgb(var(--bg));color:rgb(var(--ink));transition:background-color .25s ease,color .25s ease}
[x-cloak]{display:none!important}
html[lang="en"] .font-ui{font-family:"Hind Siliguri",system-ui,sans-serif}
/* Deadline alert card */
.alert-card{--a-bg:var(--al-warn-bg);--a-bd:var(--al-warn-bd);--a-fg:var(--al-warn-fg);--a-hi:var(--al-warn-hi);
  background:rgb(var(--a-bg));border:1px solid rgb(var(--a-bd));color:rgb(var(--a-fg));transition:background-color .3s,border-color .3s,color .3s}
.alert-card.is-bad{--a-bg:var(--al-bad-bg);--a-bd:var(--al-bad-bd);--a-fg:var(--al-bad-fg);--a-hi:var(--al-bad-hi)}
.alert-hi{color:rgb(var(--a-hi))}
.alert-track{background:rgb(var(--a-bd)/.45)}
.alert-fill{background:rgb(var(--a-hi))}
.alert-dot{background:rgb(var(--a-hi));box-shadow:0 0 0 0 rgb(var(--a-hi)/.6);animation:alert-pulse 1.8s ease-out infinite}
@keyframes alert-pulse{0%{box-shadow:0 0 0 0 rgb(var(--a-hi)/.55)}70%{box-shadow:0 0 0 7px rgb(var(--a-hi)/0)}100%{box-shadow:0 0 0 0 rgb(var(--a-hi)/0)}}
@keyframes cd-tick{from{transform:translateY(-35%);opacity:0}to{transform:none;opacity:1}}
.cd-tick{display:inline-block;animation:cd-tick .35s cubic-bezier(.2,.8,.2,1)}
/* Header switches */
.seg-btn{transition:background-color .2s ease,color .2s ease}
.seg-btn[aria-pressed="true"]{background:rgb(var(--ink));color:rgb(var(--bg))}
.seg-btn[aria-pressed="false"]:hover{background:rgb(var(--line)/.6)}
/* Download buttons: lift, fill and shine on hover; press-in on tap */
.dl-btn{position:relative;overflow:hidden;isolation:isolate;transition:transform .18s ease,box-shadow .18s ease,background-color .2s ease,color .2s ease,border-color .2s ease}
.dl-btn::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 35%,rgb(var(--accent)/.35) 50%,transparent 65%);transform:translateX(-110%);transition:transform .7s ease}
.dl-btn .ic{display:inline-block;transition:transform .25s ease}
.dl-btn:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 10px 20px -12px rgb(var(--ink)/.6)}
.dl-btn:not(:disabled):hover::after{transform:translateX(110%)}
.dl-btn:not(:disabled):hover .ic{animation:dl-nudge .9s ease-in-out infinite}
.dl-btn:not(:disabled):active{transform:translateY(0) scale(.97);box-shadow:none}
.dl-outline:not(:disabled):hover{background:rgb(var(--ink));color:rgb(var(--bg))}
.dl-primary:not(:disabled):hover{background:rgb(var(--ink)/.92)}
@keyframes dl-nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(3px)}}
@keyframes dl-pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.dl-pop{animation:dl-pop .35s ease-out}
@keyframes sheet-fade{from{opacity:0}}
@keyframes sheet-up{from{transform:translateY(32px);opacity:0}}
.sheet-fade{animation:sheet-fade .2s ease-out}
.sheet-up{animation:sheet-up .28s cubic-bezier(.2,.8,.2,1)}
@media (hover:none){.dl-btn:not(:disabled):hover{transform:none;box-shadow:none}.dl-btn:not(:disabled):hover .ic{animation:none}.dl-outline:not(:disabled):hover{background:transparent;color:inherit}}
.bench-grid{background-image:linear-gradient(rgb(var(--ink)/.05) 1px,transparent 1px),linear-gradient(90deg,rgb(var(--ink)/.05) 1px,transparent 1px);background-size:20px 20px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div x-data="plateApp()" x-init="init()" class="font-ui text-[15px] sm:text-base leading-relaxed min-h-full">

  <!-- Header: mobile stacks switches / centered title / alert; desktop puts title left, switches + alert right -->
  <header class="border-b-2 border-ink">
    <div class="mx-auto max-w-7xl 3xl:max-w-[1600px] px-4 sm:px-6 lg:px-8 py-3 sm:py-4 grid gap-2.5 sm:gap-x-6 sm:gap-y-2 items-center
                [grid-template-areas:'tools'_'title'_'alert'] sm:[grid-template-areas:'title_tools'_'title_alert'] sm:grid-cols-[minmax(0,1fr)_auto]">

      <div class="[grid-area:title] min-w-0 text-center sm:text-left">
        <h1 class="text-[1.4rem] xs:text-2xl sm:text-3xl lg:text-4xl font-bold leading-tight [text-wrap:balance]" x-text="t('title')">সামনের নম্বর প্লেট মেকার</h1>
        <p class="text-xs sm:text-sm text-muted mt-1 [text-wrap:balance]" x-text="t('subtitle')"></p>
      </div>

      <div class="[grid-area:tools] flex items-center justify-center sm:justify-end gap-2">
        <div class="flex rounded-full border border-line bg-surface p-0.5 text-xs font-semibold" role="group" :aria-label="t('langLabel')">
          <button type="button" class="seg-btn rounded-full px-3 min-h-[34px]" :aria-pressed="(lang === 'bn').toString()" @click="setLang('bn')" lang="bn">বাংলা</button>
          <button type="button" class="seg-btn rounded-full px-3 min-h-[34px]" :aria-pressed="(lang === 'en').toString()" @click="setLang('en')" lang="en">English</button>
        </div>
        <div class="flex rounded-full border border-line bg-surface p-0.5" role="group" :aria-label="t('themeLabel')">
          <button type="button" class="seg-btn rounded-full w-[34px] h-[34px] grid place-items-center" :aria-pressed="(!isDark).toString()" @click="setTheme('light')" :title="t('themeLight')" :aria-label="t('themeLight')">
            <svg viewBox="0 0 24 24" class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" class="seg-btn rounded-full w-[34px] h-[34px] grid place-items-center" :aria-pressed="isDark.toString()" @click="setTheme('dark')" :title="t('themeDark')" :aria-label="t('themeDark')">
            <svg viewBox="0 0 24 24" class="w-[17px] h-[17px]" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          </button>
        </div>
      </div>

      <!-- Deadline alert: amber while there is time, red in the final week and after the deadline -->
      <div class="[grid-area:alert] alert-card justify-self-stretch sm:justify-self-end w-full sm:w-auto sm:min-w-[300px] rounded-lg px-3 py-2"
           :class="cdLevel === 'bad' ? 'is-bad' : ''" role="timer" aria-live="off">
        <p class="sr-only" x-text="cdDone ? t('cdOver') : t('cdSummary', cd)"></p>
        <div class="flex items-center gap-2 text-[11px] sm:text-xs font-semibold leading-tight" aria-hidden="true">
          <span class="alert-dot inline-block w-2 h-2 rounded-full shrink-0"></span>
          <svg viewBox="0 0 24 24" class="w-3.5 h-3.5 shrink-0 alert-hi" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>
          <span x-text="cdDone ? t('cdOver') : cdLevel === 'bad' ? t('cdUrgent') : t('cdLeft')"></span>
          <span class="ml-auto font-normal opacity-80 text-right" x-text="t('cdEnd')"></span>
        </div>
        <div class="mt-1 flex items-baseline justify-center sm:justify-start gap-x-3 gap-y-0 flex-wrap tabular-nums" aria-hidden="true">
          <template x-for="u in cdUnits()" :key="u.k === 's' ? 's' + u.v : u.k">
            <span class="whitespace-nowrap">
              <b class="text-lg sm:text-xl leading-none alert-hi" :class="u.k === 's' && !cdDone ? 'cd-tick' : ''" x-text="u.v"></b>
              <small class="text-[10px] sm:text-[11px] font-semibold ml-0.5" x-text="u.l"></small>
            </span>
          </template>
        </div>
        <div class="alert-track h-[3px] mt-1.5 rounded-full overflow-hidden" aria-hidden="true" :title="t('cdBar', Math.round(elapsed))">
          <div class="alert-fill h-full rounded-full transition-[width] duration-700" :style="`width:${elapsed}%`"></div>
        </div>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-7xl 3xl:max-w-[1600px] px-4 sm:px-6 lg:px-8 pt-0 md:pt-6 pb-6 md:pb-10
               grid gap-5 md:gap-6 lg:gap-8 md:grid-cols-[minmax(0,320px)_minmax(0,1fr)] lg:grid-cols-[minmax(0,370px)_minmax(0,1fr)] items-start">

    <!-- Preview: pinned on phones, sticky column on larger screens -->
    <section aria-labelledby="h-prev"
      class="order-first md:order-last md:col-start-2 md:row-start-1 sticky top-[env(safe-area-inset-top,0px)] z-20
             -mx-4 sm:-mx-6 md:mx-0 md:-mt-6 bg-bg pt-3 pb-3 md:pt-6 md:pb-4 px-4 sm:px-6 md:px-0
             border-b border-line shadow-[0_8px_12px_-12px_rgba(0,0,0,.35)] min-w-0">
      <div class="flex items-baseline justify-between gap-3 mb-2">
        <h2 id="h-prev" class="text-[11px] sm:text-xs tracking-[.08em] uppercase text-muted font-semibold" x-text="t('preview')"></h2>
        <span class="text-[11px] font-semibold px-2 py-0.5 rounded-full"
              :class="ok ? 'bg-ok/15 text-ok' : 'bg-bad/15 text-bad'" x-text="ok ? t('okBadge') : t('fixBadge')"></span>
      </div>
      <div class="bench-grid bg-bench rounded-md p-3 xs:p-4 sm:p-8 lg:p-10 grid place-items-center"
           :class="vt === 'scooter' ? 'min-h-[150px] sm:min-h-[260px]' : 'min-h-[90px] sm:min-h-[200px]'">
        <canvas x-ref="plate" width="3366" height="591" :aria-label="t('canvasLabel')"
          class="block h-auto max-w-full rounded-[3px] bg-white shadow-[0_1px_0_rgba(0,0,0,.25),0_12px_24px_-12px_rgba(0,0,0,.5)]"
          :class="vt === 'scooter' ? 'w-[min(100%,360px)] sm:w-[min(100%,420px)]' : 'w-full'"></canvas>
      </div>
      <div class="hidden xs:flex flex-wrap gap-x-4 gap-y-1 font-mono text-[11px] sm:text-xs text-muted mt-2 tabular-nums">
        <template x-for="m in meta" :key="m"><span x-text="m"></span></template>
      </div>
    </section>

    <!-- Form -->
    <section aria-labelledby="h-in" class="md:row-span-2 md:row-start-1 md:col-start-1 bg-surface border border-line rounded-md p-4 sm:p-5 min-w-0">
      <h2 id="h-in" class="text-xs tracking-[.08em] uppercase text-muted font-semibold mb-4" x-text="t('regInfo')"></h2>
      <form @submit.prevent class="grid gap-4" autocomplete="off">

        <fieldset class="grid gap-1.5">
          <legend class="font-semibold text-sm mb-1.5" x-text="t('vehicle')"></legend>
          <div class="grid grid-cols-2 border border-line rounded overflow-hidden">
            <template x-for="o in ['moto','scooter']" :key="o">
              <label class="relative cursor-pointer text-center px-2 py-2.5 min-h-[48px] font-semibold text-sm border-l first:border-l-0 border-line transition-colors focus-within:ring-2 focus-within:ring-accent focus-within:ring-inset"
                     :class="vt === o ? 'bg-ink text-bg' : 'bg-bg hover:bg-line/40'">
                <input type="radio" name="vt" :id="'vt-' + o" :value="o" x-model="vt" class="sr-only">
                <span x-text="t(o)"></span>
                <small class="block font-normal text-[11px] opacity-75" x-text="t('mm', SPEC[o])"></small>
              </label>
            </template>
          </div>
        </fieldset>

        <fieldset class="grid gap-1.5">
          <legend class="font-semibold text-sm mb-1.5" x-text="t('inputMode')"></legend>
          <div class="grid grid-cols-2 border border-line rounded overflow-hidden">
            <template x-for="o in [{v:'struct',k:'fromForm'},{v:'custom',k:'typeOwn'}]" :key="o.v">
              <label class="cursor-pointer text-center px-2 py-2.5 min-h-[44px] font-semibold text-sm border-l first:border-l-0 border-line transition-colors focus-within:ring-2 focus-within:ring-accent focus-within:ring-inset"
                     :class="mode === o.v ? 'bg-ink text-bg' : 'bg-bg hover:bg-line/40'">
                <input type="radio" name="mode" :id="'md-' + o.v" :value="o.v" x-model="mode" class="sr-only">
                <span x-text="t(o.k)"></span>
              </label>
            </template>
          </div>
        </fieldset>

        <div x-show="mode === 'struct'" class="grid gap-4">
          <div class="grid gap-1.5">
            <label for="district" class="font-semibold text-sm" x-text="t('district')"></label>
            <select id="district" x-model="district" class="w-full min-h-[44px] text-base px-3 py-2 bg-bg border border-line rounded focus:outline-none focus:ring-2 focus:ring-accent">
              <optgroup :label="t('metroGroup')">
                <template x-for="d in METRO" :key="d[0]"><option :value="d[0]" x-text="place(d)" :selected="d[0] === district"></option></template>
              </optgroup>
              <template x-for="g in DIVS" :key="g.bn">
                <optgroup :label="lang === 'bn' ? g.bn : g.en">
                  <template x-for="d in g.list" :key="d[0]"><option :value="d[0]" x-text="place(d)" :selected="d[0] === district"></option></template>
                </optgroup>
              </template>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div class="grid gap-1.5 min-w-0">
              <label for="cls" class="font-semibold text-sm" x-text="t('cls')"></label>
              <select id="cls" x-model="cls" class="w-full min-h-[44px] text-base px-3 py-2 bg-bg border border-line rounded focus:outline-none focus:ring-2 focus:ring-accent">
                <optgroup :label="t('moto')"><template x-for="c in BIKE_CLS" :key="c"><option :value="c" x-text="c" :selected="c === cls"></option></template></optgroup>
                <optgroup :label="t('otherGroup')"><template x-for="c in OTHER_CLS" :key="c"><option :value="c" x-text="c" :selected="c === cls"></option></template></optgroup>
              </select>
            </div>
            <div class="grid gap-1.5 min-w-0">
              <label for="series" class="font-semibold text-sm"><span x-text="t('series')"></span> <span class="font-normal text-muted" x-text="t('twoDigits')"></span></label>
              <input id="series" type="text" inputmode="numeric" maxlength="2" x-model="series" @blur="series = toBn(digits(series))"
                     class="w-full min-h-[44px] text-base px-3 py-2 bg-bg border border-line rounded focus:outline-none focus:ring-2 focus:ring-accent tabular-nums">
            </div>
          </div>
          <div class="grid gap-1.5">

    toBn, digits,

    // preferences
    lang: "bn", theme: "", sysDark: false, hostTheme: "",
    // form state
    vt: "moto", mode: "struct", district: "ঢাকা মেট্রো", cls: "ল", series: "১১", num: "১২২৯",
    custom: "ঢাকা মেট্রো-ল-১১-১২২৯", font: "Noto Sans Bengali|800", frame: "1.5", holes: false, copies: 3,
    // derived
    cd: { d: 0, h: 0, m: 0, s: 0 }, cdDone: false, cdLevel: "warn", elapsed: 0,
    ok: true, checks: [], meta: [], status: null, dlCap: null, lines: [],

    // ---------- language & theme ----------
    t(key, p) {
      const v = I18N[this.lang][key] ?? I18N.bn[key];
      return typeof v === "function" ? v(p) : (v ?? key);
    },
    n(x) { return this.lang === "bn" ? toBn(x) : String(x); },
    place(d) { return this.lang === "bn" ? d[0] : `${d[1]} · ${d[0]}`; },
    setLang(v) {
      this.lang = v;
      document.documentElement.lang = v;
      document.title = this.t("title");
      try { localStorage.setItem("fp-lang", v); } catch (e) {}
    },
    get isDark() {
      if (this.theme) return this.theme === "dark";
      if (this.hostTheme) return this.hostTheme === "dark";
      return this.sysDark;
    },
    setTheme(v) {
      this.theme = v;
      document.documentElement.setAttribute("data-theme", v);
      try { localStorage.setItem("fp-theme", v); } catch (e) {}
    },

    init() {
      try {
        this.theme = localStorage.getItem("fp-theme") || "";
        const l = localStorage.getItem("fp-lang"); if (l === "en" || l === "bn") this.lang = l;
      } catch (e) {}
      if (!this.theme) this.hostTheme = document.documentElement.getAttribute("data-theme") || "";
      const mq = matchMedia("(prefers-color-scheme: dark)");
      this.sysDark = mq.matches;
      mq.addEventListener?.("change", e => { this.sysDark = e.matches; });
      this.setLang(this.lang);

      this.tick();
      // Align ticks to the start of each second so the timer never skips
      setTimeout(() => { this.tick(); setInterval(() => this.tick(), 1000); }, 1000 - (Date.now() % 1000));
      try {
        const saved = JSON.parse(localStorage.getItem("fp-inputs") || "null");
        if (saved) ["vt","mode","district","cls","series","num","custom","font","frame","holes"].forEach(k => { if (saved[k] != null) this[k] = saved[k]; });
      } catch (e) {}
      this.copies = this.SPEC[this.vt].perA4;
      this.$watch("vt", v => { this.copies = Math.min(this.copies, this.SPEC[v].perA4) || this.SPEC[v].perA4; });
      // Redraw whenever any input changes
      Alpine.effect(() => {
        const s = { vt: this.vt, mode: this.mode, district: this.district, cls: this.cls, series: this.series, num: this.num,
                    custom: this.custom, font: this.font, frame: this.frame, holes: this.holes };
        this.redraw(s);
        try { localStorage.setItem("fp-inputs", JSON.stringify(s)); } catch (e) {}
      });
      document.fonts.ready.then(() => this.redraw(this.snap()));
      (async () => { try { this.dlCap = window.claude?.use ? await window.claude.use("downloads") : null; } catch (e) { this.dlCap = null; } })();
    },

    // ---------- countdown ----------
    tick() {
      const now = Date.now(), ms = Math.max(0, DEADLINE - now), s = Math.floor(ms / 1000);
      this.cd = { d: Math.floor(s / 86400), h: Math.floor(s % 86400 / 3600), m: Math.floor(s % 3600 / 60), s: s % 60 };
      this.cdDone = ms === 0;
      this.cdLevel = this.cdDone || this.cd.d < 7 ? "bad" : "warn";
      this.elapsed = Math.min(100, Math.max(0, (now - NOTICE) / (DEADLINE - NOTICE) * 100));
    },
    cdUnits() {
      const pad = x => this.n(String(x).padStart(2, "0"));
      return [{ k: "d", v: this.n(this.cd.d), l: this.t("u_d") }, { k: "h", v: pad(this.cd.h), l: this.t("u_h") },
              { k: "m", v: pad(this.cd.m), l: this.t("u_m") }, { k: "s", v: pad(this.cd.s), l: this.t("u_s") }];
    },

    // ---------- plate ----------
    snap() {
      return { vt: this.vt, mode: this.mode, district: this.district, cls: this.cls, series: this.series, num: this.num,
               custom: this.custom, font: this.font, frame: this.frame, holes: this.holes };
    },

    buildLines(s) {
      if (s.mode === "custom") {
        const raw = toBn(s.custom.trim());
        if (s.vt === "moto") return [raw.replace(/\s*\/\s*/g, "-")];
        if (raw.includes("/")) return raw.split("/").map(x => x.trim()).slice(0, 2);
        const m = raw.match(/^(.*?)[-\s]+([০-৯]{2}[-\s]*[০-৯]{3,4})$/);
        return m ? [m[1], m[2]] : [raw];
      }
      const head = `${s.district}-${s.cls}`;
      const tail = `${toBn(digits(s.series).slice(0, 2))}-${toBn(digits(s.num).slice(0, 4))}`;
      return s.vt === "moto" ? [`${head}-${tail}`] : [head, tail];
    },

    async redraw(s) {
      const [family, weight] = s.font.split("|");
      try { await document.fonts.load(`${weight} 100px "${family}"`, "ঢাকা মেট্রো-ল-১১-১২২৯"); } catch (e) {}
      const L = this.buildLines(s);
      const meas = renderPlate(this.$refs.plate, this.SPEC[s.vt], { family, weight, frame: parseFloat(s.frame), holes: s.holes }, L);
      this.lines = L;
      this.evaluate(s, L, meas);
      const sp = this.SPEC[s.vt];
      this.meta = [`${sp.w} × ${sp.h} mm`, `${meas.W} × ${meas.H} px @ ${DPI} DPI`, `text ${meas.digitMM.toFixed(1)} mm`,
                   meas.condense < 0.999 ? `width ${Math.round(meas.condense * 100)}%` : "width 100%", `frame ${s.frame} mm`];
    },

    // Checks are stored as keys + params so they re-render when the language changes
    evaluate(s, L, meas) {
      const text = L.join("");
      const latin = /[A-Za-z]/.test(text);
      const odd = /[^ঀ-৿\s\-]/.test(text.replace(/[A-Za-z]/g, ""));
      const empty = !text.trim();
      const sp = this.SPEC[s.vt];
      const tall = meas.digitMM >= MIN_CHAR_MM - 0.05;
      const c = [
        { k: "ok", key: "chk_size", p: { w: sp.w, h: sp.h, vt: s.vt } },
        { k: "ok", key: "chk_colour" },
        { k: tall ? "ok" : "bad", key: "chk_height", p: { mm: meas.digitMM.toFixed(1), tall } },
        { k: latin || empty ? "bad" : "ok", key: latin ? "chk_latin" : empty ? "chk_empty" : "chk_bangla" },
        { k: odd ? "warn" : "ok", key: odd ? "chk_odd" : "chk_clean" }
      ];
      if (s.vt === "moto") c.push({ k: "ok", key: "chk_oneLine" });
      if (s.mode === "struct" && (digits(s.series).length !== 2 || digits(s.num).length !== 4))
        c.push({ k: "warn", key: "chk_digits" });
      this.checks = c;
      this.ok = !empty && !latin && tall;
    },

    // ---------- downloads ----------

    sheet: { open: false, name: "", url: "", isImg: false, canShare: false, file: null },
    inApp: /FBAN|FBAV|FB_IAB|FBIOS|Messenger|Instagram|Line\/|MicroMessenger|Snapchat|musical_ly|; wv\)/i.test(navigator.userAgent),
    canDownload: "download" in HTMLAnchorElement.prototype,

    icon(k) { return this.busy === k ? this.ICONS.spin : this.done === k ? this.ICONS.check : this.ICONS.arrow; },

    fresh() {
      const s = this.snap(); const [family, weight] = s.font.split("|");
      const cv = document.createElement("canvas");
      renderPlate(cv, this.SPEC[s.vt], { family, weight, frame: parseFloat(s.frame), holes: s.holes }, this.lines);
      return cv;
    },
    // ASCII-only names: some phone browsers drop non-Latin names and fall back to the page name
    baseName() {
      const num = digits(this.lines.join("")).slice(-6) || "plate";
      return `bd-front-plate-${this.vt === "moto" ? "motorcycle" : "scooter"}-${num}`;
    },

    async run(kind) {
      if (this.busy || !this.ok) return;
      this.busy = kind; this.done = ""; this.last = null; this.status = { k: "st_building" };
      // Let the spinner paint, then build synchronously so the click still counts as the user's action
      await new Promise(r => { requestAnimationFrame(() => requestAnimationFrame(r)); setTimeout(r, 60); });
      let out;
      try { out = this.build(kind); }
      catch (e) { this.busy = ""; this.status = { k: "st_failed" }; return; }
      await this.deliver(out.name, out.blob, kind);
      this.busy = "";
    },

    build(kind) {
      const base = this.baseName(), sp = this.SPEC[this.vt];
      if (kind === "jpg") return { name: base + ".jpg", blob: jpg300(this.fresh()) };
      if (kind === "png") return { name: base + ".png", blob: png300(this.fresh()) };
      const img = this.fresh().toDataURL("image/png");
      if (kind === "pdf") {
        const doc = new jspdf.jsPDF({ unit: "mm", format: [sp.w, sp.h], orientation: sp.w > sp.h ? "landscape" : "portrait", compress: true });
        doc.addImage(img, "PNG", 0, 0, sp.w, sp.h, "plate", "FAST");
        return { name: base + ".pdf", blob: pdfBlob(doc) };
      }
      // A4 sheet; 285 mm is wider than A4 portrait, so motorcycle plates go one per landscape page
      const n = this.copies;
      const doc = new jspdf.jsPDF({ unit: "mm", format: "a4", orientation: sp.w > 200 ? "landscape" : "portrait", compress: true });
      doc.setFontSize(8); doc.setTextColor(90);
      if (sp.w > 200) {
        for (let i = 0; i < n; i++) {
          if (i) doc.addPage("a4", "landscape");
          doc.setFontSize(8); doc.setTextColor(90);
          doc.text(`${sp.w} x ${sp.h} mm  |  Print at 100% scale (Actual size)`, 148.5, 12, { align: "center" });
          cropPlate(doc, img, (297 - sp.w) / 2, (210 - sp.h) / 2, sp);
        }
      } else {
        const gap = 18, totalH = n * sp.h + (n - 1) * gap, x = (210 - sp.w) / 2;
        let y = Math.max(20, (297 - totalH) / 2);
        doc.text(`${sp.w} x ${sp.h} mm  |  Print at 100% scale (Actual size), do not fit to page`, 105, 12, { align: "center" });
        for (let i = 0; i < n; i++) { cropPlate(doc, img, x, y, sp); y += sp.h + gap; }
      }
      return { name: base + "-A4.pdf", blob: pdfBlob(doc) };
    },

    flash(kind) { this.done = kind; setTimeout(() => { if (this.done === kind) this.done = ""; }, 2200); },

    async deliver(name, blob, kind) {
      if (this.dlCap) {
        try { await this.dlCap.save({ filename: name, data: blob }); this.status = { k: "st_saved", p: name }; this.flash(kind); }
        catch (e) { this.status = { k: e?.code === "declined" ? "st_declined" : "st_unavailable" }; }
        return;
      }
      if (this.inApp || !this.canDownload) { this.openSheet(name, blob, kind); this.status = null; return; }
      triggerDownload(blob, name);
      this.last = { name, blob, kind };
      this.status = { k: "st_downloading", p: name };
      this.flash(kind);
    },

    openSheet(name, blob, kind) {
      if (this.sheet.url) URL.revokeObjectURL(this.sheet.url);
      const file = new File([blob], name, { type: blob.type });
      let canShare = false;
      try { canShare = !!(navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) {}
      this.sheet = { open: true, name, url: URL.createObjectURL(blob), isImg: kind === "jpg" || kind === "png", canShare, file };
    },
    closeSheet() { this.sheet.open = false; },
    async shareFile() {
      try { await navigator.share({ files: [this.sheet.file], title: this.sheet.name }); } catch (e) {}
    },
    retryDownload() { triggerDownload(this.sheet.file, this.sheet.name); },
    async copyLink() {
      const url = location.href.split("#")[0];
      try { await navigator.clipboard.writeText(url); this.copied = true; setTimeout(() => this.copied = false, 2500); }
      catch (e) { this.status = { k: "st_link", p: url }; }
    }
  };
}

function cropPlate(doc, img, x, y, sp) {
  doc.addImage(img, "PNG", x, y, sp.w, sp.h, "plate", "FAST"); // same alias: image stored once
  doc.setDrawColor(120); doc.setLineWidth(0.2);
  const L = 5, o = 2, x2 = x + sp.w, y2 = y + sp.h;
  [[x, y, -1, -1], [x2, y, 1, -1], [x, y2, -1, 1], [x2, y2, 1, 1]].forEach(([cx, cy, sx, sy]) => {
    doc.line(cx + sx * o, cy, cx + sx * (o + L), cy); doc.line(cx, cy + sy * o, cx, cy + sy * (o + L));
  });
}

// Draw the plate at true 300-DPI size; returns measurements in mm
function renderPlate(cv, sp, o, L) {
  const W = Math.round(sp.w * MM), H = Math.round(sp.h * MM);
  cv.width = W; cv.height = H;
  const c = cv.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, W, H);

  const fr = o.frame * MM;
  const inset = (o.frame ? o.frame + 0.8 : 0) * MM;
  if (fr) { c.strokeStyle = "#000"; c.lineWidth = fr; c.strokeRect(fr / 2, fr / 2, W - fr, H - fr); }

  const holeR = 2.5 * MM, holeGap = o.holes ? (holeR * 2 + 3 * MM) : 0;
  if (o.holes) {
    c.strokeStyle = "#888"; c.lineWidth = 0.3 * MM; c.setLineDash([0.8 * MM, 0.8 * MM]);
    [inset + 4 * MM + holeR, W - inset - 4 * MM - holeR].forEach(x => { c.beginPath(); c.arc(x, H / 2, holeR, 0, Math.PI * 2); c.stroke(); });
    c.setLineDash([]);
  }

  const padX = inset + 2.5 * MM + holeGap, padY = inset + 3 * MM;
  const boxW = W - padX * 2, boxH = H - padY * 2;
  const rowGap = sp.lines > 1 ? 4 * MM : 0;
  const rowH = (boxH - rowGap * (L.length - 1)) / L.length;
  const font = px => `${o.weight} ${px}px "${o.family}", "Noto Sans Bengali", sans-serif`;
  c.fillStyle = "#000"; c.textAlign = "center"; c.textBaseline = "alphabetic";

  // Largest size where every row fits its height, allowing up to 10% horizontal condensing for width
  const fits = px => { c.font = font(px); return L.every(t => { const m = c.measureText(t || " "); return m.width * MAX_CONDENSE <= boxW && (m.actualBoundingBoxAscent + m.actualBoundingBoxDescent) <= rowH; }); };
  let lo = 10, hi = rowH * 1.6;
  for (let i = 0; i < 24; i++) { const mid = (lo + hi) / 2; fits(mid) ? lo = mid : hi = mid; }
  c.font = font(lo);
  // One condense factor for all rows so a scooter's two lines match
  const widest = Math.max(...L.map(t => c.measureText(t || " ").width));
  const sx = Math.min(1, boxW / widest);

  const totalH = rowH * L.length + rowGap * (L.length - 1);
  const y0 = (H - totalH) / 2;
  L.forEach((t, i) => {
    const m = c.measureText(t || " ");
    const th = m.actualBoundingBoxAscent + m.actualBoundingBoxDescent;
    const top = y0 + i * (rowH + rowGap) + (rowH - th) / 2;
    c.save(); c.translate(W / 2, 0); c.scale(sx, 1); c.fillText(t, 0, top + m.actualBoundingBoxAscent); c.restore();
  });
  const dm = c.measureText("০১২৩৪৫৬৭৮৯");
  return { digitMM: (dm.actualBoundingBoxAscent + dm.actualBoundingBoxDescent) / MM, condense: sx, W, H };
}

// Start a real file download; keep the blob URL alive long enough for slow mobile download prompts
function triggerDownload(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name; a.rel = "noopener"; a.style.display = "none";
  document.body.append(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 120000);
}
const pdfBlob = doc => new Blob([doc.output("arraybuffer")], { type: "application/pdf" });
function dataUrlBytes(d) {
  const b = atob(d.slice(d.indexOf(",") + 1)), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}
function jpg300(cv) {
  const u = dataUrlBytes(cv.toDataURL("image/jpeg", 0.95));
  if (u[2] === 0xFF && u[3] === 0xE0 && u[6] === 0x4A) { u[13] = 1; u[14] = 1; u[15] = 44; u[16] = 1; u[17] = 44; } // JFIF 300 DPI
  return new Blob([u], { type: "image/jpeg" });
}
function png300(cv) {
  const u = dataUrlBytes(cv.toDataURL("image/png"));
  const ppm = Math.round(DPI / 0.0254);
  const data = new Uint8Array(9), dv = new DataView(data.buffer);
  dv.setUint32(0, ppm); dv.setUint32(4, ppm); data[8] = 1;
  const type = new TextEncoder().encode("pHYs");
  const crcIn = new Uint8Array(13); crcIn.set(type); crcIn.set(data, 4);
  let crc = ~0; for (const x of crcIn) { crc ^= x; for (let k = 0; k < 8; k++) crc = (crc >>> 1) ^ (0xEDB88320 & -(crc & 1)); } crc = ~crc >>> 0;
  const chunk = new Uint8Array(21), cdv = new DataView(chunk.buffer);
  cdv.setUint32(0, 9); chunk.set(type, 4); chunk.set(data, 8); cdv.setUint32(17, crc);
  const at = 33, out = new Uint8Array(u.length + 21);
  out.set(u.slice(0, at)); out.set(chunk, at); out.set(u.slice(at), at + 21);
  return new Blob([out], { type: "image/png" });
}
